name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: windows-2022
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      # astral-sh/setup-uv v10.1.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.8.11"
          enable-cache: true
          prune-cache: true
          download-from-astral-mirror: false
      - run: uv sync --locked --python 3.11
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run python scripts/check_licenses.py
      - run: uv build --out-dir dist/python
      - run: uv run python scripts/check_licenses.py --python-artifacts dist/python
      - run: uv run pytest -q

  executable-build-smoke:
    runs-on: windows-2022
    env:
      PYTHONHASHSEED: "0"
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      # astral-sh/setup-uv v10.1.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.8.11"
          enable-cache: true
          prune-cache: true
          download-from-astral-mirror: false
      - run: uv sync --locked --python 3.11
      - run: uv run python scripts/check_licenses.py --runtime
      - shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
          $expectedProtocol = [int](uv run python -c "from td_cli.protocol import PROTOCOL_VERSION; print(PROTOCOL_VERSION)")
          'td','td-daemon','td-agent' | ForEach-Object { uv run pyinstaller --clean --noconfirm "packaging/$_.spec" }
          $clean = New-Item -ItemType Directory "$env:RUNNER_TEMP/clean"
          Push-Location $clean
          try {
            'td','td-daemon','td-agent' | ForEach-Object { & "$env:GITHUB_WORKSPACE/dist/$_.exe" --version }
            & "$env:GITHUB_WORKSPACE/dist/td-daemon.exe" start
            $status = & "$env:GITHUB_WORKSPACE/dist/td-daemon.exe" status --json | ConvertFrom-Json
            if ($status.status -ne 'running' -or $status.protocol_versions -notcontains $expectedProtocol) {
              throw 'Frozen Daemon lifecycle smoke failed'
            }
          }
          finally {
            & "$env:GITHUB_WORKSPACE/dist/td-daemon.exe" stop
            Pop-Location
          }

  promotion-policy:
    if: github.base_ref == 'main'
    runs-on: windows-2022
    steps:
      - shell: pwsh
        env: { HEAD_REPO: "${{ github.event.pull_request.head.repo.full_name }}", HEAD_REF: "${{ github.head_ref }}" }
        run: |
          if ($env:HEAD_REPO -ne '${{ github.repository }}' -or $env:HEAD_REF -ne 'develop') {
            throw 'Pull requests to main must promote the repository develop branch'
          }

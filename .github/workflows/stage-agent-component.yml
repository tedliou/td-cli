name: Stage Agent Component
on:
  workflow_dispatch:
    inputs:
      source_commit: { description: "Exact commit built in locked TouchDesigner", required: true, type: string }
      version: { description: "Exact pyproject Release Version", required: true, type: string }
      stage_archive_base64: { description: "Base64 ZIP prepared after local locked-TD validation", required: true, type: string }
      stage_archive_sha256: { description: "SHA-256 of the decoded stage ZIP", required: true, type: string }

permissions:
  contents: read

jobs:
  stage:
    runs-on: windows-2022
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: "${{ inputs.source_commit }}", persist-credentials: false }
      # astral-sh/setup-uv v10.1.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.8.11"
          prune-cache: true
          download-from-astral-mirror: false
      - run: uv sync --locked --python 3.11
      - name: Import locally validated stage input
        shell: pwsh
        env:
          STAGE_ARCHIVE_BASE64: "${{ inputs.stage_archive_base64 }}"
          STAGE_ARCHIVE_SHA256: "${{ inputs.stage_archive_sha256 }}"
        run: |
          [IO.File]::WriteAllBytes('agent-stage.zip', [Convert]::FromBase64String($env:STAGE_ARCHIVE_BASE64))
          $actual = (Get-FileHash agent-stage.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:STAGE_ARCHIVE_SHA256.ToLowerInvariant()) { throw 'Stage archive digest mismatch' }
          Expand-Archive agent-stage.zip agent-stage
      - name: Validate staged files supplied by authorized environment
        shell: pwsh
        env:
          RELEASE_VERSION: "${{ inputs.version }}"
          SOURCE_COMMIT: "${{ inputs.source_commit }}"
        run: |
          $actual = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($actual -ne $env:RELEASE_VERSION) { throw 'Release Version mismatch' }
          uv run python -c "import os; from pathlib import Path; from td_cli.release import validate_agent_stage; validate_agent_stage(Path('agent-stage'), expected_commit=os.environ['SOURCE_COMMIT'])"
      - id: upload
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "td-agent-component-${{ inputs.version }}-${{ inputs.source_commit }}"
          path: agent-stage/
          retention-days: 30
          if-no-files-found: error
          overwrite: false
          archive: true
      - name: Record immutable staging identity
        shell: pwsh
        env:
          ARTIFACT_ID: "${{ steps.upload.outputs.artifact-id }}"
          ARTIFACT_DIGEST: "${{ steps.upload.outputs.artifact-digest }}"
          SOURCE_COMMIT: "${{ inputs.source_commit }}"
          RELEASE_VERSION: "${{ inputs.version }}"
        run: |
          @"
          run_id=${{ github.run_id }}
          artifact_id=$env:ARTIFACT_ID
          artifact_digest=$env:ARTIFACT_DIGEST
          head_sha=$env:SOURCE_COMMIT
          version=$env:RELEASE_VERSION
          retention_days=30
          "@ | Out-File -Append $env:GITHUB_STEP_SUMMARY
